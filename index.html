<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Samsung Voucher Monitoring</title>
<style>
:root{--blue:#1465ff;--navy:#071b3a;--bg:#f5f7fb;--text:#14213d;--muted:#71809a;--line:#e5eaf2;--green:#12a66a;--red:#e84b4b;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.app{min-height:100vh;display:flex}.side{width:248px;background:linear-gradient(180deg,#061b3b,#0a2d62);color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0}.brand{padding:4px 12px 26px}.brand b{font-size:24px;letter-spacing:2px}.brand span{display:block;color:#b9c7df;font-size:12px;margin-top:4px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dbe7fb;text-align:left;padding:13px 14px;border-radius:12px;cursor:pointer;font-weight:650}.nav button.active,.nav button:hover{background:#1465ff;color:#fff}.main{margin-left:248px;width:calc(100% - 248px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}.pill{background:#eaf1ff;color:var(--blue);padding:9px 13px;border-radius:999px;font-weight:750;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(24,50,90,.05)}.metric .label{color:var(--muted);font-size:12px;font-weight:700}.metric .value{font-size:30px;font-weight:800;margin-top:7px}.metric small{color:var(--muted)}.section{margin-top:16px}.section h2{font-size:16px;margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}.item b{font-size:13px}.item small{display:block;color:var(--muted);margin-top:3px}.search{display:flex;gap:10px}.input,.select{width:100%;border:1px solid #d8dfeb;border-radius:12px;background:#fff;padding:13px 14px;outline:none}.input:focus,.select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1465ff18}.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;padding:12px 17px;cursor:pointer}.btn.secondary{background:#eef3fb;color:#24416c}.status{padding:12px;border-radius:12px;background:#eef4ff;color:#34517c;font-size:13px}.status.good{background:#e8faf2;color:#087b4c}.status.bad{background:#fff0f0;color:#b52c2c}.hide{display:none!important}.modal{position:fixed;inset:0;background:rgba(5,18,40,.58);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modalbox{background:#fff;width:min(620px,100%);max-height:min(80vh,720px);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px #0004}.modalhead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modalbody{padding:14px;overflow:auto;max-height:60vh}.voucher{padding:14px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer}.voucher:hover{border-color:var(--blue);background:#f6f9ff}.mobilebar{display:none}
@media(max-width:800px){.side{display:none}.main{margin:0;width:100%;padding:16px 14px 90px}.top h1{font-size:22px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card{border-radius:15px;padding:14px}.metric .value{font-size:24px}.row{grid-template-columns:1fr;gap:10px}.mobilebar{display:flex;position:fixed;z-index:9;left:10px;right:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px #1233;padding:7px;justify-content:space-around}.mobilebar button{border:0;background:transparent;padding:8px;color:var(--muted);font-size:11px;font-weight:750}.mobilebar button.active{color:var(--blue)}.search{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><b>SAMSUNG</b><span>Voucher Monitoring</span></div>
  <div class="nav">
    <button data-page="dashboard" class="active">⌂ Dashboard</button>
    <button data-page="available">🎟 Gunakan Voucher</button>
    <button data-page="check">⌕ Cek Voucher</button>
    <button data-page="history">☷ Histori</button>
  </div>
</aside>
<main class="main">
  <div class="top"><div><h1 id="title">Dashboard</h1><p id="subtitle">Monitoring penggunaan voucher secara real-time</p></div><div class="pill" id="apiState">Connecting…</div></div>
  <div id="content"></div>
</main>
<div class="mobilebar">
  <button data-page="dashboard" class="active">⌂<br>Home</button>
  <button data-page="available">🎟<br>Voucher</button>
  <button data-page="check">⌕<br>Cek</button>
  <button data-page="history">☷<br>Histori</button>
</div>
</div>

<div id="modal" class="modal hide"><div class="modalbox"><div class="modalhead"><b>Voucher AVAILABLE</b><button class="btn secondary" onclick="closeModal()">Tutup</button></div><div class="modalbody"><input id="voucherSearch" class="input" placeholder="Cari kode voucher…" oninput="filterVoucher()"><div id="voucherList" style="margin-top:12px"></div></div></div></div>

<script>
const API_BASE = "PASTE_APPS_SCRIPT_EXEC_URL_HERE";
let dashboardData=null, masters=null, available=[];

async function apiGet(action,params={}){
  if(API_BASE.includes("PASTE_")) throw new Error("Masukkan URL Web App Apps Script pada API_BASE di index.html.");
  const q=new URLSearchParams({action,...params});
  const r=await fetch(API_BASE+"?"+q.toString(),{method:"GET",redirect:"follow"});
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch(e){throw new Error("Response API bukan JSON: "+text.slice(0,160))}
  if(data.ok===false) throw new Error(data.message||"API error");
  return data;
}
function money(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function setPage(p){
 document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===p));
 if(p==="dashboard") dashboard();
 if(p==="available") showAvailable();
 if(p==="check") showCheck();
 if(p==="history") showHistory();
}
document.querySelectorAll("[data-page]").forEach(x=>x.onclick=()=>setPage(x.dataset.page));

async function ping(){
 try{const d=await apiGet("test");apiState.textContent="API Connected";apiState.style.background="#e8faf2";apiState.style.color="#087b4c"}catch(e){apiState.textContent="API Error";apiState.style.background="#fff0f0";apiState.style.color="#b52c2c"}
}
async function dashboard(){
 title.textContent="Dashboard";subtitle.textContent="Monitoring penggunaan voucher Samsung secara real-time";
 content.innerHTML='<div class="card"><div class="status">Memuat dashboard…</div></div>';
 try{
  const r=await apiGet("dashboard");dashboardData=r.data||{};
  const d=dashboardData;
  const products=Array.isArray(d.products)?d.products:[], sales=Array.isArray(d.sales)?d.sales:[], recent=Array.isArray(d.recent)?d.recent:[];
  content.innerHTML=`
   <div class="grid">
    <div class="card metric"><div class="label">TOTAL VOUCHER</div><div class="value">${d.total||0}</div></div>
    <div class="card metric"><div class="label">AVAILABLE</div><div class="value">${d.available||0}</div><small>${Number(d.availablePct||0).toFixed(1)}%</small></div>
    <div class="card metric"><div class="label">USED</div><div class="value">${d.used||0}</div><small>${Number(d.usedPct||0).toFixed(1)}%</small></div>
    <div class="card metric"><div class="label">TOTAL BENEFIT</div><div class="value" style="font-size:21px">${money(d.totalBenefit)}</div></div>
   </div>
   <div class="row section">
    <div class="card"><h2>Penggunaan per Produk</h2><div class="list">${products.length?products.map(x=>`<div class="item"><div><b>${esc(x.product)}</b><small>${x.count||0} transaksi</small></div><b>${money(x.benefit)}</b></div>`).join(""):'<div class="status">Belum ada transaksi.</div>'}</div></div>
    <div class="card"><h2>Top Sales</h2><div class="list">${sales.length?sales.map((x,i)=>`<div class="item"><div><b>#${i+1} ${esc(x.sales)}</b><small>${x.count||0} transaksi</small></div><b>${money(x.benefit)}</b></div>`).join(""):'<div class="status">Belum ada transaksi.</div>'}</div></div>
   </div>
   <div class="card section"><h2>Recent Usage</h2><div class="list">${recent.length?recent.map(x=>`<div class="item"><div><b>${esc(x.KODE_VOUCHER||"")}</b><small>${esc(x.PRODUK||"")} · ${esc(x.USED_BY||"")}</small></div><small>${esc(x.NO_POS||x.POS||"")}</small></div>`).join(""):'<div class="status">Belum ada histori.</div>'}</div></div>`;
 }catch(e){content.innerHTML=`<div class="card"><div class="status bad">${esc(e.message)}</div></div>`}
}
async function loadAvailable(){
 const r=await apiGet("available");available=Array.isArray(r.data)?r.data:[];return available;
}
async function showAvailable(){
 title.textContent="Gunakan Voucher";subtitle.textContent="Pilih voucher AVAILABLE atau scan kode voucher";
 content.innerHTML='<div class="card"><div class="status">Memuat voucher…</div></div>';
 try{
  await loadAvailable();
  content.innerHTML=`<div class="card">
   <div class="status good"><b>${available.length}</b> voucher AVAILABLE</div>
   <div style="margin-top:14px"><button class="btn" onclick="openModal()">🎟 Pilih Voucher AVAILABLE</button></div>
   <div class="section"><input class="input" id="manualCode" placeholder="Atau scan / ketik kode voucher lalu Enter" onkeydown="if(event.key==='Enter')checkManual()"></div>
   <div id="selectedBox" class="section"></div>
  </div>`;
 }catch(e){content.innerHTML=`<div class="card"><div class="status bad">${esc(e.message)}</div></div>`}
}
function openModal(){document.getElementById("modal").classList.remove("hide");renderVoucherList(available)}
function closeModal(){document.getElementById("modal").classList.add("hide")}
function filterVoucher(){const q=document.getElementById("voucherSearch").value.toLowerCase();renderVoucherList(available.filter(v=>String(v.KODE_VOUCHER).toLowerCase().includes(q)))}
function renderVoucherList(list){document.getElementById("voucherList").innerHTML=list.length?list.map(v=>`<div class="voucher" onclick="selectVoucher('${esc(v.KODE_VOUCHER)}')"><b>${esc(v.KODE_VOUCHER)}</b><small style="display:block;color:var(--muted);margin-top:4px">${money(v.NILAI_VOUCHER)} · AVAILABLE</small></div>`).join(""):'<div class="status">Tidak ada voucher.</div>'}
function selectVoucher(code){closeModal();document.getElementById("selectedBox").innerHTML=`<div class="status good">✓ ${esc(code)} dipilih. Tahap berikutnya kita sambungkan ke form redeem.</div>`}
async function checkManual(){const c=document.getElementById("manualCode").value.trim();if(!c)return;try{const r=await apiGet("check",{code:c});document.getElementById("selectedBox").innerHTML=`<div class="status ${r.ok?"good":"bad"}">${esc(r.message||JSON.stringify(r.data||r))}</div>`}catch(e){document.getElementById("selectedBox").innerHTML=`<div class="status bad">${esc(e.message)}</div>`}}
async function showCheck(){title.textContent="Cek Voucher";subtitle.textContent="Lihat status dan histori voucher";content.innerHTML=`<div class="card"><div class="search"><input id="checkCode" class="input" placeholder="Masukkan kode voucher"><button class="btn" onclick="doCheck()">Cek Voucher</button></div><div id="checkResult" class="section"></div></div>`}
async function doCheck(){const c=checkCode.value.trim();if(!c)return;checkResult.innerHTML='<div class="status">Mengecek…</div>';try{const r=await apiGet("check",{code:c});checkResult.innerHTML=`<div class="status ${r.ok?"good":"bad"}">${esc(r.message||JSON.stringify(r.data||r))}</div>`}catch(e){checkResult.innerHTML=`<div class="status bad">${esc(e.message)}</div>`}}
async function showHistory(){title.textContent="Histori Voucher";subtitle.textContent="Riwayat penggunaan voucher";content.innerHTML='<div class="card"><div class="status">Memuat histori…</div></div>';try{const r=await apiGet("history");const a=Array.isArray(r.data)?r.data:[];content.innerHTML=`<div class="card"><div class="list">${a.length?a.map(x=>`<div class="item"><div><b>${esc(x.KODE_VOUCHER||"")}</b><small>${esc(x.PRODUK||"")} · ${esc(x.USED_BY||"")} · ${esc(x.EMAIL_CUSTOMER||"")}</small></div><small>${esc(x.NO_POS||"")}</small></div>`).join(""):'<div class="status">Belum ada histori.</div>'}</div></div>`}catch(e){content.innerHTML=`<div class="card"><div class="status bad">${esc(e.message)}</div></div>`}}
ping();dashboard();
</script>
</body>
</html>
