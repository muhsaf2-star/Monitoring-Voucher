<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Samsung Voucher Monitoring</title><style>
:root{--b:#4da3ff;--n:#2478c9;--bg:#eef8ff;--t:#17324d;--m:#6b849c;--l:#d8ebf8;--g:#2e9b74;--r:#df5b64}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:linear-gradient(180deg,#061b3b,#0a2e66);color:#fff;padding:24px 16px;z-index:5}.brand{padding:5px 12px 28px}.brand b{font-size:24px;letter-spacing:2px}.brand span{display:block;color:#b9c8df;font-size:12px;margin-top:3px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dce8fa;text-align:left;padding:14px;border-radius:12px;font-weight:750;cursor:pointer}.nav button:hover,.nav button.active{background:var(--b);color:#fff}.main{margin-left:250px;padding:28px;max-width:1550px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:var(--m);font-size:13px}.pill{padding:9px 13px;border-radius:999px;background:#e9f8f1;color:#08794c;font-weight:800;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px;box-shadow:0 7px 25px #132b4e0d}.metric .label{font-size:11px;font-weight:800;color:var(--m)}.metric .value{font-size:30px;font-weight:850;margin-top:6px}.metric small{color:var(--m)}.section{margin-top:14px}.row,.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.section h2{font-size:16px;margin:0 0 12px}.status{padding:12px 14px;border-radius:12px;background:#eef4ff;color:#3a5378;font-size:13px}.good{background:#e7f8f0;color:#08794c}.bad{background:#fff0f0;color:#b82e2e}.btn{border:0;border-radius:12px;background:var(--b);color:#fff;padding:12px 17px;font-weight:850;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e5f3fc;color:#29476f}.input,.select{width:100%;border:1px solid #d5ddea;background:#fff;border-radius:12px;padding:13px 14px;outline:0}.input:focus,.select:focus{border-color:var(--b);box-shadow:0 0 0 3px #4da3ff17}.field label{display:block;color:var(--m);font-size:11px;font-weight:800;margin:0 0 6px}.pos{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}.prefix{background:#edf3ff;color:var(--b);padding:13px 12px;border-radius:12px;font-weight:850;white-space:nowrap}.selected{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{background:#edf3ff;color:#1855c9;border:1px solid #cddcff;border-radius:999px;padding:8px 10px;font-weight:750;font-size:12px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--l);border-radius:12px}.item b{font-size:13px}.item small{display:block;color:var(--m);margin-top:3px}.empty{padding:20px;text-align:center;color:var(--m)}.modal{position:fixed;inset:0;background:#020e22a0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.hide{display:none!important}.modalbox{width:min(650px,100%);max-height:min(84vh,760px);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 90px #0005;display:flex;flex-direction:column}.modalhead,.modalfoot{padding:17px 18px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;gap:10px}.modalfoot{border-top:1px solid var(--l);border-bottom:0}.modalbody{padding:14px;overflow:auto}.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--l);padding:13px;border-radius:13px;margin-top:8px;cursor:pointer}.vrow.sel{border-color:var(--b);background:#f2f6ff}.vrow .code{font-weight:850}.vrow small{color:var(--m)}.check{width:21px;height:21px;accent-color:var(--b)}.mobilebar{display:none}.toast{position:fixed;right:20px;bottom:20px;z-index:50;padding:13px 16px;border-radius:12px;color:#fff;background:#16345e;box-shadow:0 12px 35px #0003;font-weight:750}.toast.good{background:#0d9a63}.toast.bad{background:#d83e3e}
@media(max-width:850px){.side{display:none}.main{margin:0;padding:15px 13px 90px}.top h1{font-size:23px}.top p{font-size:12px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:14px;border-radius:15px}.metric .value{font-size:25px}.row,.formgrid{grid-template-columns:1fr;gap:10px}.mobilebar{display:flex;position:fixed;left:9px;right:9px;bottom:9px;z-index:10;background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 12px 35px #0002;padding:6px;justify-content:space-around}.mobilebar button{border:0;background:transparent;color:var(--m);font-size:11px;font-weight:800;padding:7px 9px}.mobilebar button.active{color:var(--b)}.modal{padding:10px}.modalbox{max-height:88vh;border-radius:18px}.prefix{font-size:12px;padding:13px 9px}.toast{left:12px;right:12px;bottom:82px;text-align:center}}

/* DASHBOARD CHARTS */
.chart-card{min-height:330px}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.chart-head h2{margin:0;font-size:16px}.chart-head p{margin:4px 0 0;color:var(--m);font-size:11px}
.chart-list{display:grid;gap:16px;margin-top:8px}
.chart-row{display:grid;gap:7px}.chart-row-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.chart-row-top b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chart-row-top span{font-size:11px;color:var(--m);white-space:nowrap}
.chart-track{height:12px;background:#e5f3fc;border-radius:999px;overflow:hidden}.chart-bar{height:100%;min-width:4px;border-radius:999px;background:linear-gradient(90deg,#4da3ff,#8bc8ff);transition:width .35s ease}
.sales-track .chart-bar{background:linear-gradient(90deg,#3fa77e,#74d3ad)}
.daily-chart{height:210px;display:flex;align-items:flex-end;gap:9px;padding:8px 2px 0;border-bottom:1px solid var(--l);margin-top:10px}
.day-col{height:100%;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}.day-value{font-size:10px;font-weight:800;color:#4c7090}.day-bar{width:min(34px,72%);min-height:5px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#4da3ff,#8db8ff);transition:height .35s ease}.day-col small{font-size:9px;color:var(--m);max-width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-wrap{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;min-height:245px}.donut{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#4da3ff 0 100%,#e5f3fc 100%);position:relative;margin:auto}.donut:after{content:"";width:104px;height:104px;background:#fff;border-radius:50%;position:absolute}.donut-center{position:relative;z-index:1;text-align:center}.donut-center b{display:block;font-size:18px}.donut-center span{font-size:10px;color:var(--m)}.legend{display:grid;gap:9px;max-height:205px;overflow:auto}.legend-item{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:11px}.legend-dot{width:10px;height:10px;border-radius:50%;background:#4da3ff}.legend-item small{color:var(--m)}
.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dashboard-grid .wide{grid-column:1/-1}
@media(max-width:850px){.dashboard-grid{grid-template-columns:1fr}.dashboard-grid .wide{grid-column:auto}.chart-card{min-height:0}.donut-wrap{grid-template-columns:1fr;gap:10px}.legend{max-height:none}.donut{width:145px;height:145px}.donut:after{width:88px;height:88px}.daily-chart{height:170px}.chart-row-top b{max-width:58%}}
</style></head><body>
<aside class="side"><div class="brand"><b>SAMSUNG</b><span>Voucher Monitoring</span></div><div class="nav"><button data-page="dashboard" class="active">⌂ Dashboard</button><button data-page="redeem">🎟 Gunakan Voucher</button><button data-page="check">⌕ Cek Voucher</button><button data-page="history">☷ Histori</button></div></aside>
<main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><p id="subtitle">Monitoring penggunaan voucher Samsung secara real-time</p></div><div id="apiState" class="pill">Connecting…</div></div><div id="content"></div></main>
<div class="mobilebar"><button data-page="dashboard" class="active">⌂<br>Home</button><button data-page="redeem">🎟<br>Voucher</button><button data-page="check">⌕<br>Cek</button><button data-page="history">☷<br>Histori</button></div>
<div id="modal" class="modal hide"><div class="modalbox"><div class="modalhead"><b>Pilih Voucher AVAILABLE</b><button class="btn secondary" onclick="closeModal()">Tutup</button></div><div class="modalbody"><input id="vsearch" class="input" placeholder="Cari kode voucher…" oninput="renderPicker()"><div id="picker"></div></div><div class="modalfoot"><span id="pickCount" class="status">0 voucher dipilih</span><button class="btn" onclick="confirmPick()">Pilih Voucher</button></div></div></div><div id="toast" class="toast hide"></div>
<script>
const API_BASE="https://script.google.com/macros/s/AKfycbyQx--YqYHU-PLXWxKobnPjtZ3CEfz7FzUplZ81X4lXHoeZ_PpIqHxeXiMvIEDUscdC/exec",STORE_CODE="SS007";let masters={sales:[],products:[]},available=[],selected=new Set();const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),money=n=>"Rp "+Number(n||0).toLocaleString("id-ID");
function toast(s,g=true){$("toast").textContent=s;$("toast").className="toast "+(g?"good":"bad");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").className="toast hide",3500)}
async function get(action,p={}){let r=await fetch(API_BASE+"?"+new URLSearchParams({action,...p}),{redirect:"follow"}),t=await r.text(),d;try{d=JSON.parse(t)}catch(e){throw Error("API tidak mengembalikan JSON.")}if(d.ok===false)throw Error(d.message||"API error");return d}
async function post(action,payload){let r=await fetch(API_BASE,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload}),redirect:"follow"}),t=await r.text();try{return JSON.parse(t)}catch(e){throw Error("Response redeem bukan JSON. Jika ini terjadi, backend perlu mengizinkan POST dari GitHub.")}}
function setActivePage(p){
  document.querySelectorAll("[data-page]").forEach(x=>{
    x.classList.toggle("active", x.dataset.page===p);
  });
}

async function nav(p){
  p=String(p||"").trim().toLowerCase();
  setActivePage(p);
  try{
    if(p==="dashboard") return await dashboard();
    if(p==="redeem") return await redeem();
    if(p==="check") return checkPage();
    if(p==="history") return await historyPage();
  }catch(e){
    $("content").innerHTML=`<div class="card"><div class="status bad">${esc(e.message||e)}</div></div>`;
  }
}

document.querySelectorAll("[data-page]").forEach(x=>{
  x.addEventListener("click", function(e){
    e.preventDefault();
    e.stopPropagation();
    nav(this.dataset.page);
  });
});
async function ping(){try{await get("test");$("apiState").textContent="API Connected"}catch(e){$("apiState").textContent="API Error";$("apiState").className="pill bad"}}
async function dashboard(){
  $("title").textContent="Dashboard";
  $('subtitle').textContent="Monitoring penggunaan voucher Samsung secara real-time";
  $('content').innerHTML='<div class="card"><div class="status">Memuat dashboard…</div></div>';
  try{
    let d=(await get("dashboard")).data||{},
        ps=d.products||[],
        ss=d.sales||[],
        dd=d.daily||[],
        rr=d.recent||[];

    const productMax=Math.max(...ps.map(x=>Number(x.count||0)),1);
    const salesMax=Math.max(...ss.map(x=>Number(x.count||0)),1);
    const dailyMax=Math.max(...dd.map(x=>Number(x.count||0)),1);
    const totalBenefit=Number(d.totalBenefit||0);

    const productChart=ps.length?ps.map(x=>{
      const pct=Math.max(3,Math.round(Number(x.count||0)/productMax*100));
      return `<div class="chart-row">
        <div class="chart-row-top"><b title="${esc(x.product)}">${esc(x.product)}</b><span>${x.count||0} transaksi · ${money(x.benefit)}</span></div>
        <div class="chart-track"><div class="chart-bar" style="width:${pct}%"></div></div>
      </div>`;
    }).join(""):"<div class=empty>Belum ada transaksi.</div>";

    const salesChart=ss.length?ss.map((x,i)=>{
      const pct=Math.max(3,Math.round(Number(x.count||0)/salesMax*100));
      return `<div class="chart-row">
        <div class="chart-row-top"><b title="${esc(x.sales)}">#${i+1} ${esc(x.sales)}</b><span>${x.count||0} transaksi · ${money(x.benefit)}</span></div>
        <div class="chart-track sales-track"><div class="chart-bar" style="width:${pct}%"></div></div>
      </div>`;
    }).join(""):"<div class=empty>Belum ada transaksi.</div>";

    const dailyChart=dd.length?dd.map(x=>{
      const h=Math.max(7,Math.round(Number(x.count||0)/dailyMax*145));
      return `<div class="day-col"><div class="day-value">${x.count||0}</div><div class="day-bar" style="height:${h}px"></div><small title="${esc(x.date)}">${esc(x.date)}</small></div>`;
    }).join(""):'<div class=empty style="width:100%">Belum ada data harian.</div>';

    const palette=['#4da3ff','#49a0ff','#7db8ff','#9b8cff','#10a66a','#f3a43b','#df4040','#66758f'];
    let running=0;
    const legend=ps.length?ps.map((x,i)=>{
      const benefit=Number(x.benefit||0);
      const pct=totalBenefit?benefit/totalBenefit*100:0;
      const start=running;
      running+=pct;
      return `<div class="legend-item"><i class="legend-dot" style="background:${palette[i%palette.length]}"></i><div><b>${esc(x.product)}</b><small>${money(benefit)} · ${pct.toFixed(pct>=10?0:1)}%</small></div><span>${x.count||0}</span></div>`;
    }).join(""):"<div class=empty>Belum ada data.</div>";
    const donutStops=ps.length?ps.map((x,i)=>{
      const pct=totalBenefit?Number(x.benefit||0)/totalBenefit*100:0;
      return `${palette[i%palette.length]} ${running=0}`;
    }):[];
    let cursor=0;
    const stops=ps.length?ps.map((x,i)=>{
      const pct=totalBenefit?Number(x.benefit||0)/totalBenefit*100:0;
      const s=cursor;cursor+=pct;
      return `${palette[i%palette.length]} ${s}% ${cursor}%`;
    }).join(','): '#e5f3fc 0 100%';

    $('content').innerHTML=`
      <div class="grid">
        <div class="card metric"><div class="label">TOTAL VOUCHER</div><div class="value">${d.total||0}</div><small>Semua voucher</small></div>
        <div class="card metric"><div class="label">AVAILABLE</div><div class="value">${d.available||0}</div><small>${Number(d.availablePct||0).toFixed(0)}% dari total</small></div>
        <div class="card metric"><div class="label">USED</div><div class="value">${d.used||0}</div><small>${Number(d.usedPct||0).toFixed(0)}% dari total</small></div>
        <div class="card metric"><div class="label">TOTAL BENEFIT</div><div class="value" style="font-size:20px">${money(d.totalBenefit)}</div><small>Benefit transaksi</small></div>
      </div>

      <div class="dashboard-grid section">
        <div class="card chart-card">
          <div class="chart-head"><div><h2>Penggunaan per Produk</h2><p>Jumlah transaksi berdasarkan produk</p></div></div>
          <div class="chart-list">${productChart}</div>
        </div>

        <div class="card chart-card">
          <div class="chart-head"><div><h2>Top Sales</h2><p>Jumlah transaksi berdasarkan sales</p></div></div>
          <div class="chart-list">${salesChart}</div>
        </div>

        <div class="card chart-card">
          <div class="chart-head"><div><h2>Penggunaan 7 Hari Terakhir</h2><p>Jumlah voucher yang digunakan per hari</p></div></div>
          <div class="daily-chart">${dailyChart}</div>
        </div>

        <div class="card chart-card">
          <div class="chart-head"><div><h2>Kontribusi Benefit per Produk</h2><p>Total benefit berdasarkan produk</p></div></div>
          <div class="donut-wrap">
            <div class="donut" style="background:conic-gradient(${stops})"><div class="donut-center"><b>${money(totalBenefit)}</b><span>Total Benefit</span></div></div>
            <div class="legend">${legend}</div>
          </div>
        </div>

        <div class="card section wide">
          <div class="chart-head"><div><h2>Recent Usage</h2><p>Aktivitas voucher terbaru</p></div></div>
          <div class="list">${rr.length?rr.map(x=>`<div class="item"><div><b>${esc(x.code)}</b><small>${esc(x.product)} · ${esc(x.sales)}</small></div><div style="text-align:right"><b>${money(x.benefit||x.totalBenefit)}</b><small>${esc(x.pos)}</small></div></div>`).join(""):"<div class=empty>Belum ada histori.</div>"}</div>
        </div>
      </div>`;
  }catch(e){
    $('content').innerHTML=`<div class="card"><div class="status bad">${esc(e.message)}</div></div>`;
  }
}
async function loadMasters(){masters=(await get("master")).data||{sales:[],products:[]}}async function loadAvail(){available=(await get("available")).data||[]}
async function redeem(){$("title").textContent="Gunakan Voucher";$('subtitle').textContent="Pilih beberapa voucher untuk satu transaksi";$('content').innerHTML='<div class="card"><div class="status">Memuat master…</div></div>';try{await Promise.all([loadMasters(),loadAvail()]);renderRedeem()}catch(e){$('content').innerHTML=`<div class="card"><div class="status bad">${esc(e.message)}</div></div>`}}
function prefix(){let d=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta",year:"numeric",month:"2-digit"}).format(new Date()).replace("-","");return STORE_CODE+d}function productRow(){return masters.products.find(x=>x.NAMA_PRODUK===$("product")?.value)}function val(){return available.filter(x=>selected.has(String(x.KODE_VOUCHER).trim().toUpperCase())).reduce((a,x)=>a+Number(x.NILAI_VOUCHER||0),0)}
function renderRedeem(){let so=masters.sales.map(x=>`<option>${esc(x.NAMA_SALES)}</option>`).join(""),po=masters.products.map(x=>`<option value="${esc(x.NAMA_PRODUK)}">${esc(x.NAMA_PRODUK)}</option>`).join("");$('content').innerHTML=`<div class="card"><div class="status good"><b>${available.length}</b> voucher AVAILABLE</div><div class="section"><button class="btn" onclick="openModal()">🎟 Pilih Voucher AVAILABLE</button><div id="chips" class="selected"></div></div><div class="formgrid section"><div class="field"><label>NO POS — 5 DIGIT TERAKHIR</label><div class="pos"><span class="prefix">${prefix()}</span><input id="pos" class="input" inputmode="numeric" maxlength="5" placeholder="00012" oninput="this.value=this.value.replace(/\D/g,'').slice(0,5);summary()"></div></div><div class="field"><label>USED BY / SALES</label><select id="sales" class="select" onchange="summary()"><option value="">Pilih nama sales</option>${so}</select></div><div class="field"><label>PRODUK</label><select id="product" class="select" onchange="summary()"><option value="">Pilih produk</option>${po}</select></div><div class="field"><label>BENEFIT OTOMATIS</label><div id="benefit" class="status" style="font-size:20px;font-weight:850">-</div></div></div><div class="field section"><label>EMAIL CUSTOMER — OPSIONAL</label><input id="email" class="input" type="email" placeholder="customer@email.com"></div><div class="formgrid section"><div class="field"><label>INPUT BY</label><input id="inputBy" class="input" value="Administrator"></div><div class="field"><label>RINGKASAN</label><div id="summaryBox" class="status">Pilih produk dan voucher.</div></div></div><div class="section"><button id="redeemBtn" class="btn" style="width:100%" disabled onclick="submitRedeem()">GUNAKAN VOUCHER</button></div></div>`;summary();renderChips()}
function summary(){let p=productRow(),need=p?Number(p.BENEFIT||0):0,n=selected.size,v=val();if($('benefit'))$('benefit').textContent=p?money(need):"-";let msg=!p?"Pilih produk.":!n?`Produk ini membutuhkan ${need/100000} voucher.`:v!==need?`Butuh ${money(need)} · dipilih ${money(v)}.`:`${n} voucher siap digunakan · ${money(v)}.`;$('summaryBox').textContent=msg;$('summaryBox').className="status "+(p&&n&&v===need?"good":"");$('redeemBtn').disabled=!(p&&n&&v===need&&/^\d{5}$/.test($('pos').value)&&$('sales').value)}
function renderChips(){$('chips').innerHTML=selected.size?[...selected].map(x=>`<span class=chip>${esc(x)}</span>`).join(""):'<span style="font-size:12px;color:var(--m)">Belum ada voucher dipilih.</span>'}
function openModal(){$('modal').classList.remove('hide');$('vsearch').value="";renderPicker()}function closeModal(){$('modal').classList.add('hide')}function renderPicker(){let q=$('vsearch').value.toLowerCase(),a=available.filter(x=>String(x.KODE_VOUCHER).toLowerCase().includes(q));$('pickCount').textContent=`${selected.size} voucher dipilih`;$('picker').innerHTML=a.length?a.map(x=>{let c=String(x.KODE_VOUCHER),k=c.trim().toUpperCase(),s=selected.has(k);return `<div class="vrow ${s?'sel':''}" onclick="toggleV('${esc(c)}')"><div><div class=code>${esc(c)}</div><small>${money(x.NILAI_VOUCHER)} · AVAILABLE</small></div><input class=check type=checkbox ${s?'checked':''} onclick="event.stopPropagation();toggleV('${esc(c)}')"></div>`}).join(""):'<div class=empty>Tidak ada voucher.</div>'}function toggleV(c){let k=String(c).trim().toUpperCase();selected.has(k)?selected.delete(k):selected.add(k);renderPicker();summary()}function confirmPick(){closeModal();summary();renderChips()}
async function submitRedeem(){let b=$('redeemBtn');b.disabled=true;b.textContent="MEMPROSES…";try{let r=await post("redeem",{payload:{codes:[...selected],posSuffix:$('pos').value,sales:$('sales').value,product:$('product').value,email:$('email').value.trim(),inputBy:$('inputBy').value.trim()||"Administrator"}});if(!r.ok)throw Error(r.message||"Gagal menggunakan voucher.");toast(r.message||"Voucher berhasil digunakan.");let code=r.transaction?.codes?.[0]||[...selected][0];selected=new Set();await loadAvail();renderRedeem();setTimeout(()=>checkPage(code),300)}catch(e){toast(e.message,false);b.disabled=false;b.textContent="GUNAKAN VOUCHER"}}
async function checkPage(pref=""){$('title').textContent="Cek Voucher";$('subtitle').textContent="Lihat status dan histori pemakaian voucher";$('content').innerHTML=`<div class=card><div style="display:flex;gap:9px"><input id=checkInput class=input value="${esc(pref)}" placeholder="Masukkan / scan kode voucher" onkeydown="if(event.key==='Enter')doCheck()"><button class=btn onclick=doCheck()>CEK</button></div><div id=checkResult class=section></div></div>`}async function doCheck(){let c=$('checkInput').value.trim();if(!c)return;$('checkResult').innerHTML='<div class=status>Mengecek…</div>';try{let r=await get("check",{code:c}),h=r.history||[];$('checkResult').innerHTML=`<div class="status ${r.status==='USED'?'bad':'good'}"><b>${r.status==='USED'?'VOUCHER SUDAH DIPAKAI':'VOUCHER TERSEDIA'}</b> · ${esc(r.voucher.code)} · ${money(r.voucher.value)}</div>${h.length?`<div class=section><h2>Histori Pemakaian</h2><div class=list>${h.map(x=>`<div class=item><div><b>${esc(x.code)}</b><small>POS ${esc(x.pos)} · ${esc(x.sales)} · ${esc(x.product)}</small><small>${esc(x.email||'-')} · Input by ${esc(x.inputBy||'-')}</small></div><small>${esc(x.date)} ${esc(x.time)}</small></div>`).join("")}</div></div>`:''}`}catch(e){$('checkResult').innerHTML=`<div class="status bad">${esc(e.message)}</div>`}}
async function historyPage(){$('title').textContent="Histori Voucher";$('subtitle').textContent="Riwayat penggunaan voucher";$('content').innerHTML='<div class=card><div class=status>Memuat histori…</div></div>';try{let a=(await get("history")).data||[];$('content').innerHTML=`<div class=card><div class=list>${a.length?a.map(x=>`<div class=item><div><b>${esc(x.code)}</b><small>POS ${esc(x.pos)} · ${esc(x.sales)} · ${esc(x.product)}</small><small>${esc(x.email||'-')} · Input by ${esc(x.inputBy||'-')}</small></div><div style=text-align:right><b>${money(x.totalBenefit||x.benefit)}</b><small>${esc(x.date)} ${esc(x.time)}</small></div></div>`).join(""):'<div class=empty>Belum ada histori.</div>'}</div></div>`}catch(e){$('content').innerHTML=`<div class=card><div class="status bad">${esc(e.message)}</div></div>`}}
ping();dashboard();
</script></body></html>
